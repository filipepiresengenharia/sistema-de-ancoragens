:root{--brand:#166344;--ink:#172a24;--muted:#5c6c64;--line:#d9e3dd;--paper:#fff;--bg:#f2f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,sans-serif;color:var(--ink)}header{background:var(--brand);color:white;padding:20px clamp(16px,4vw,52px)}header h1{margin:0;font-size:23px}header small{opacity:.9}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px clamp(12px,4vw,52px);background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}button,.btn{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:9px 14px;cursor:pointer}button.primary,nav button.active{background:var(--brand);color:white;border-color:var(--brand)}button.danger{color:#a52d2d}main{max-width:1200px;margin:20px auto;padding:0 16px 60px}h2{margin:0 0 10px;font-size:23px}h3{margin:16px 0 10px;font-size:17px}p{line-height:1.5}small,.muted{color:var(--muted)}.notice{background:#fff5df;border:1px solid #e6c88a;padding:12px;border-radius:8px;margin:12px 0;color:#744c15}.card,details{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}summary{font-weight:650;cursor:pointer}details[open]>summary{margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px;border:1px solid #bccdc4;border-radius:6px;background:white;color:var(--ink)}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#edf3ee}td input,td select{min-width:88px}.stat{font-weight:700;font-size:20px}.bad{color:#a52d2d}.good{color:#17623b}.pending{color:#8d /* REV 02 — padrão de relatório baseado em PEP Laudos Cremalheira REV 04Q */
.doc-tools{max-width:180mm;margin:12px auto;display:flex;gap:8px;flex-wrap:wrap}
.docbook{--doc-ink:#263b32;font-family:Arial,'Segoe UI',sans-serif;color:var(--doc-ink);font-size:11px;line-height:1.43;max-width:180mm;margin:0 auto}

.doccover .cover-title{margin-top:15mm}.doccover h1{font-size:28px;line-height:1.18;color:var(--brand);margin:3mm 0}.doccover h2{font-size:17px;color:#486359;border:0}.doccover .cover-bottom{margin-top:auto}

.docbook th{background:#edf3ee;color:var(--doc-ink);text-align:left}.docbook .keytable th{width:34%}.docbook thead{display:table-header-group}

</style></head><body><header><h1>Sistema de Ancoragens</h1><small>REV 02 · ambiente de testes · memorial e ensaio</small></header><nav id="nav"></nav><main><div id="editor"></div><div id="preview" class="hide"></div></main>
<script>
'use strict';
const REV='02',SOURCE='https://walsywa.com.br/wp-content/uploads/2026/03/Catalogo-geral-walsywa-2026.pdf';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('sv-SE'),num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):null,fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const preset=()=>({id:uid(),name:'Olhal 1/2″ — conjunto usual',type:'Olhal',fix:'Química',maker:'Walsywa',model:'WQE 500 Plus',eye:'Inox AISI 316',rod:'Inox AISI 316',diam:12.7,tpi:13,hole:14,hef:110,h:140,c:45,s:60,fc:30,torque:35,ultimate:8365,required:1500,source:SOURCE,steel:'',eyeCapacity:'',edN:'',edV:'',external:'',notes:''});
const profiles=()=>[{id:'bras',name:'Brasmetal',cnpj:'',address:'Guarapari – ES',engineer:'',crea:'',logo:'',color:'#166344'},{id:'pep',name:'Pepes Engenharia',cnpj:'',address:'',engineer:'',crea:'',logo:'',color:'#204b75'}];
const point=(label,group)=>({id:uid(),label,group,floor:'',location:'',target:'',actual:'',time:'',displacement:'',before:'',after:'',result:'Pendente',notes:'',photos:[]});
function fresh(){return {schema:1,id:uid(),name:'Novo projeto',company:'bras',client:'',work:'',address:'',art:'',project:'',docCode:'',revision:'00',date:today(),purpose:'Proteção individual contra quedas',configs:[preset()],points:[],equipment:'',calibration:'',method:'',target:'',duration:'',limit:'',direction:'Tração axial',accept:'',annexes:[],templates:{memIntro:'O presente memorial estabelece as características da ancoragem e as condições mínimas exigidas do suporte.',testIntro:'O relatório registra as condições observadas e os resultados individuais dos ensaios realizados.',scope:'A verificação da estrutura global do edifício compete ao responsável técnico estrutural. O ensaio não substitui o dimensionamento.',memConclusion:'',testConclusion:'',revisionDescription:'Emissão inicial',references:'',installation:'',showPhotos:'Sim'}}}
let db,app={profiles:profiles(),library:[preset()],docs:[],current:fresh()},view='mem',timer;
function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('ancoragens-rev00',1);q.onupgradeneeded=()=>q.result.createObjectStore('state');q.onsuccess=()=>{db=q.result;resolve()};q.onerror=()=>reject(q.error)})}
function read(){return new Promise((resolve,reject)=>{let q=db.transaction('state').objectStore('state').get('app');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function save(){clearTimeout(timer);timer=setTimeout(()=>{if(!db)return;try{let t=db.transaction('state','readwrite');t.objectStore('state').put(app,'app');t.oncomplete=()=>{if($('saveStatus'))$('saveStatus').textContent='Salvo neste dispositivo'};t.onerror=()=>{if($('saveStatus'))$('saveStatus').textContent='Falha no salvamento — exporte JSON'}}catch(e){alert('Falha no armazenamento: '+e.message)}},180)}
const D=()=>app.current,P=()=>app.profiles.find(p=>p.id===D().company)||app.profiles[0];
function get(path){return path.split('.').reduce((o,k)=>o?.[k],app)}
function set(path,value){let keys=path.split('.'),key=keys.pop(),o=keys.reduce((o,k)=>o[k],app);o[key]=value;save()}
function field(label,path,type='text',opts=[],hint=''){let v=get(path);let attrs=' data-bind="'+esc(path)+'"';let control=type==='select'?'<select'+attrs+'>'+opts.map(o=>{let a=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a[0])+'" '+(String(a[0])===String(v)?'selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>':type==='textarea'?'<textarea'+attrs+'>'+esc(v)+'</textarea>':'<input type="'+type+'"'+(type==='number'?' step="any"':'')+attrs+' value="'+esc(v)+'">';return '<label class="field">'+esc(label)+control+(hint?'<small>'+esc(hint)+'</small>':'')+'</label>'}
const section=(title,body,open=true)=>'<details '+(open?'open':'')+'><summary>'+esc(title)+'</summary>'+body+'</details>',grid=s=>'<div class="grid">'+s+'</div>',f=(l,k,t='text',o=[],h='')=>field(l,'current.'+k,t,o,h),btn=(label,action,cls='')=>'<button type="button" class="'+cls+'" data-act="'+action+'">'+esc(label)+'</button>';
function identification(){return section('1. Identificação',grid(f('Empresa emissora','company','select',app.profiles.map(p=>[p.id,p.name]))+f('Cliente / contratante','client')+f('Obra','work')+f('Endereço da obra','address')+f('ART','art')+f('Projeto / prancha','project')+f('Código do documento','docCode')+f('Revisão','revision')+f('Data','date','date')+f('Finalidade','purpose'))+'<p class="muted">Dados institucionais no menu Configurações. Preenchimento automático após cadastro do perfil.</p>')}
function calc(c){let d=num(c.diam),tpi=num(c.tpi),effective=d>0&&Number.isInteger(tpi)&&tpi>0?d-.9743*25.4/tpi:null,area=c.type==='Olhal'&&effective>0?Math.PI/4*Math.pow(effective,2):null,req=num(c.required),force=req>0?req*9.80665:null,stress=area>0&&force!==null?force/area:null;let standard=c.type==='Olhal'&&c.fix==='Química'&&c.maker==='Walsywa'&&c.model==='WQE 500 Plus'&&d===12.7&&tpi===13;let checks=[['Tipo e método',c.type==='Olhal'?'Olhal — verificações preliminares':'Metodologia específica pendente'],['Área nominal da rosca',area===null?'Pendente':fmt(area)+' mm² (UNC; confirmar rosca)'],['Tensão axial nominal',stress===null?'Pendente':fmt(stress)+' MPa (carga requerida, não Ed)']];if(standard){let geometry=[num(c.hole)===14,num(c.hef)===110,num(c.h)>=140,num(c.c)>=45,num(c.s)>=60,num(c.fc)>=30];checks.push(['Geometria de referência WQE 500 Plus',geometry.every(Boolean)?'Compatível com referência nominal — não valida resistência':'Pendente ou divergente da referência nominal'],['Carga última de catálogo',num(c.ultimate)===8365?'8.365 kgf — referência nominal':'Valor alterado; comprovação necessária'])}checks.push(['Capacidade do conjunto','Pendente — resistência local, classe da haste, olhal e ações de cálculo não validadas']);return {area,stress,checks}}
function drawing(c){let hef=num(c.hef),h=num(c.h),hole=num(c.hole);return '<svg viewBox="0 0 480 205" role="img" aria-label="Corte esquemático de olhal e fixação"><rect x="155" y="45" width="285" height="116" fill="#dbe5dd" stroke="#8a9e91"/><rect x="155" y="91" width="210" height="24" fill="#c9aa77"/><rect x="118" y="97" width="242" height="12" fill="#667b83"/><circle cx="92" cy="103" r="28" fill="none" stroke="#667b83" stroke-width="12"/><g stroke="#364f44" fill="none"><path d="M155 165v18M365 165v18M155 177h210M440 45v-18M155 45v-18M155 32h285M370 91h20M370 115h20M385 91v24"/></g><g font-size="12" fill="#172a24"><text x="204" y="26">h = '+esc(h??'—')+' mm</text><text x="205" y="195">hef = '+esc(hef??'—')+' mm</text><text x="395" y="85">Ø '+esc(hole??'—')+'</text><text x="10" y="15">Corte esquemático — sem escala</text><text x="12" y="157">Olhal</text><text x="248" y="72">Concreto</text></g></svg>'}
function configFields(c,i){let base='current.configs.'+i+'.',a=(l,k,t='text',o=[],h='')=>field(l,base+k,t,o,h);return '<div class="card"><div class="actions"><strong>'+esc(c.name)+'</strong>'+btn('Remover','delconfig:'+i,'danger')+'</div>'+grid(a('Nome da configuração','name')+a('Tipo de dispositivo','type','select',['Olhal','Vergalhão caranguejo','Vergalhão em U'])+a('Tipo de fixação','fix','select',['Química','Mecânica','Outro'])+a('Fabricante','maker')+a('Modelo','model')+a('Olhal / material','eye')+a('Haste / material','rod')+a('Carga requerida (kgf)','required','number'))+section('Dimensões e dados técnicos',grid(a('Diâmetro da haste (mm)','diam','number')+a('Fios por polegada (UNC)','tpi','number')+a('Diâmetro do furo (mm)','hole','number')+a('Embutimento efetivo (mm)','hef','number')+a('Espessura do suporte (mm)','h','number')+a('Borda mínima real (mm)','c','number')+a('Espaçamento mínimo real (mm)','s','number')+a('Concreto de referência (MPa)','fc','number')+a('Torque (N·m)','torque','number')+a('Carga última de referência (kgf)','ultimate','number')+a('Classe da haste / comprovante','steel')+a('Carga de trabalho do olhal (kgf)','eyeCapacity','number')+a('Tração de cálculo Ed (kN)','edN','number')+a('Cisalhamento de cálculo Ed (kN)','edV','number')+a('Fonte técnica','source')+a('Cálculo externo / revisão','external')+a('Observações','notes','textarea')),false)+'<div id="calcs'+i+'">'+renderCalc(c)+'</div></div>'}
function renderCalc(c){return (c.type==='Olhal'?drawing(c):'<div class="notice">Desenho e cálculo específico aguardam memorial de referência.</div>')+'<table>'+calc(c).checks.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>'}
function pointTable(test){let p=D().points;return section(test?'4. Pontos e resultados':'3. Pontos e etiquetas','<div class="actions"><label>Quantidade <input id="qty" type="number" min="1" max="1000" value="1"></label><label>Prefixo <input id="prefix" value="PA-"></label><label>Pavimento <input id="floor"></label><label>Configuração <select id="group">'+D().configs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label>'+btn('Adicionar pontos','addpoints','primary')+'</div><p class="muted">'+p.length+' ponto(s). Etiquetas não são renumeradas ao excluir pontos.</p><div class="tablewrap"><table><thead><tr><th>Etiqueta</th><th>Pavimento</th><th>Localização</th><th>Configuração</th>'+(test?'<th>Carga medida (kgf)</th><th>Tempo (s)</th><th>Deslocamento (mm)</th><th>Resultado</th><th>Detalhes</th>':'')+'<th></th></tr></thead><tbody>'+p.map((x,i)=>{let a=(l,k,t='text',o=[])=>field(l,'current.points.'+i+'.'+k,t,o);return '<tr><td>'+a('','label')+'</td><td>'+a('','floor')+'</td><td>'+a('','location')+'</td><td>'+a('','group','select',D().configs.map(c=>[c.id,c.name]))+'</td>'+(test?'<td>'+a('','actual','number')+'</td><td>'+a('','time','number')+'</td><td>'+a('','displacement','number')+'</td><td>'+a('','result','select',['Pendente','Aprovado','Reprovado'])+'</td><td>'+btn('Editar','point:'+i)+'</td>':'')+'<td>'+btn('Excluir','delpoint:'+i,'danger')+'</td></tr>'}).join('')+'</tbody></table></div><p id="dupes" class="bad"></p>')}
function pointDetail(i){let x=D().points[i],a=(l,k,t='text')=>field(l,'current.points.'+i+'.'+k,t);let dialog=document.createElement('dialog');dialog.style='max-width:680px;width:92%;border:1px solid #ccd9d0;border-radius:10px;padding:20px';dialog.innerHTML='<h3>Ponto '+esc(x.label)+'</h3>'+grid(a('Carga alvo específica (kgf)','target','number')+a('Condições antes do ensaio','before','textarea')+a('Condições após o ensaio','after','textarea')+a('Observações','notes','textarea'))+'<label>Fotos do ponto <input type="file" accept="image/*" multiple data-photo="'+i+'"></label><div>'+x.photos.map((z,j)=>'<img class="thumb" src="'+esc(z.data)+'" alt="Foto '+(j+1)+'">'+btn('Remover','delphoto:'+i+':'+j)).join('')+'</div><div class="actions">'+btn('Fechar','closeDialog','primary')+'</div>';document.body.append(dialog);dialog.showModal()}
function annexes(){return section('Projetos, catálogos e anexos','<input type="file" id="attach" multiple accept="application/pdf,image/*"><p class="muted">Anexos são armazenados no dispositivo e incluídos no JSON. Imagens entram na prévia; PDFs são relacionados para juntada separada nesta revisão.</p>'+D().annexes.map((a,i)=>'<div class="actions">'+esc(a.name)+btn('Remover','delattach:'+i,'danger')+'</div>').join(''),false)}
function template(test){return section('Modelo do documento',grid(f('Texto inicial',test?'templates.testIntro':'templates.memIntro','textarea')+f('Escopo e responsabilidade','templates.scope','textarea')+f('Conclusão / recomendações adicionais',test?'templates.testConclusion':'templates.memConclusion','textarea')+f('Descrição da revisão','templates.revisionDescription','textarea')+f('Referências adicionais','templates.references','textarea')+(test?f('Incluir fotografias','templates.showPhotos','select',['Sim','Não']):f('Orientações de instalação e inspeção','templates.installation','textarea'))),false)}
function memorial(){return '<h2>Memorial de cálculo</h2>'+identification()+section('2. Configuração da ancoragem',D().configs.map(configFields).join('')+'<div class="actions">'+btn('Nova configuração','addconfig')+btn('Adicionar da biblioteca','picklib')+'</div>')+pointTable(false)+annexes()+template(false)+toolbar()}
function testForm(){return '<h2>Relatório de ensaio</h2>'+identification()+section('2. Equipamentos e calibração',grid(f('Equipamento / identificação','equipment','textarea')+f('Certificado de calibração / validade','calibration','textarea')))+section('3. Procedimento de ensaio',grid(f('Carga alvo geral (kgf)','target','number')+f('Tempo mínimo de aplicação (s)','duration','number')+f('Limite de deslocamento (mm)','limit','number')+f('Direção da carga','direction')+f('Procedimento e referência','method','textarea')+f('Critérios de aceitação','accept','textarea'))+'<p class="muted">A carga de ensaio é independente da carga requerida no memorial. Defina critérios conforme procedimento validado.</p>')+pointTable(true)+annexes()+template(true)+toolbar()}
function toolbar(){return '<div class="actions no-print">'+btn('Salvar documento','saveDoc')+btn('Exportar JSON','export')+btn('Visualizar relatório','preview','primary')+'</div>'}
function duplicateLabels(){let a=D().points.map(p=>p.label.trim().toLowerCase());return a.some((x,i)=>!x||a.indexOf(x)!==i)}
function result(p){let d=D(),a=num(p.actual),target=p.target===''||p.target===null||p.target===undefined?num(d.target):num(p.target),t=num(p.time),min=num(d.duration),disp=num(p.displacement),lim=num(d.limit);if(p.result==='Reprovado')return 'Reprovado';if(duplicateLabels()||!d.equipment.trim()||!d.calibration.trim()||!d.method.trim()||!d.accept.trim()||!p.before.trim()||!p.after.trim()||!(target>0)||!(min>0)||lim===null||lim<0||a===null||t===null||disp===null||disp<0)return 'Pendente';if(a<target||t<min||disp>lim)return 'Reprovado';return p.result==='Aprovado'?'Aprovado':'Pendente'}
function table(rows){return '<table>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>'}
function docText(v,tag){return String(v??'').trim()?esc(v):'<span class="doc-missing">'+esc(tag||'A preencher')+'</span>'}
function docKeys(rows){return '<table class="keytable"><tbody>'+rows.map(([k,v])=>'<tr><th>'+esc(k)+'</th><td>'+docText(v,k)+'</td></tr>').join('')+'</tbody></table>'}
function docTable(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+docText(v,'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function docChapter(title,html){return '<h2 data-toc="1">'+esc(title)+'</h2>'+html}
function report(test){let d=D(),p=P(),name=test?'RELATÓRIO DE ENSAIO DE ANCORAGENS':'MEMORIAL DE CÁLCULO DE ANCORAGENS',counts=['Aprovado','Reprovado','Pendente'].map(s=>[s,d.points.filter(x=>result(x)===s).length]);let logo=p.logo&&safeData(p.logo)?'<img alt="Logomarca" src="'+esc(p.logo)+'" style="max-width:45mm;max-height:14mm;object-fit:contain">':'<strong>'+esc(p.name)+'</strong>';
let identification=[['Contratante',d.client],['Obra / empreendimento',d.work],['Endereço',d.address],['Projeto / prancha',d.project],['Documento',d.docCode],['ART',d.art],['Data de emissão',d.date],['Responsável técnico',p.engineer],['CREA',p.crea],['Finalidade',d.purpose]];
let cover='<section class="doccover"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'+logo+'<span>REV '+esc(d.revision)+'</span></div><div class="cover-title"><p style="letter-spacing:.14em;color:var(--brand);font-weight:bold">ENGENHARIA · ANCORAGENS</p><h1>'+name+'</h1><h2>'+docText(d.work,'OBRA')+'</h2></div><div class="cover-bottom">'+docKeys([['Contratante',d.client],['Documento',d.docCode],['Projeto',d.project],['ART',d.art],['Emissão',d.date],['Responsável técnico',p.engineer],['CREA',p.crea]])+'<p class="doc-status">PRÉVIA DE TESTE — SEM LIBERAÇÃO DE USO</p></div></section>';
let body=docChapter('1. Identificação e controle de revisões',docKeys(identification)+docTable(['Revisão','Data','Descrição','Elaboração'],[[d.revision,d.date,d.templates.revisionDescription||'Emissão inicial',p.engineer]]));
body+=docChapter('2. Objeto, finalidade e escopo','<p>'+docText(test?d.templates.testIntro:d.templates.memIntro,'Objeto')+'</p><p>'+docText(d.templates.scope,'Escopo e responsabilidades')+'</p>');
body+=docChapter('3. Referências técnicas','<p>NR-18 e NR-35, Anexo II, conforme a aplicação. ABNT NBR 16325-1 quando aplicável. A edição, o escopo e os critérios devem ser confirmados pelo responsável técnico.</p>'+d.configs.map(c=>'<p><b>'+esc(c.name)+':</b> '+docText(c.source,'Fonte técnica')+'</p>').join('')+(d.templates.references?'<p>'+esc(d.templates.references)+'</p>':''));
body+=docChapter('4. Caracterização dos dispositivos',d.configs.map(c=>'<h3>'+esc(c.name)+'</h3>'+docKeys([['Tipo de dispositivo',c.type],['Método de fixação',c.fix],['Fabricante / modelo',c.maker+' / '+c.model],['Olhal',c.eye],['Haste',c.rod],['Carga requerida (kgf)',c.required],['Fonte',c.source]])).join(''));
if(test){body+=docChapter('5. Instrumentos e procedimento',docKeys([['Equipamento',d.equipment],['Calibração',d.calibration],['Método',d.method],['Critérios de aceitação',d.accept],['Carga geral (kgf)',d.target],['Tempo mínimo (s)',d.duration],['Limite de deslocamento (mm)',d.limit],['Direção de aplicação',d.direction]]));body+=docChapter('6. Resultados individuais',docTable(['Etiqueta','Pavimento / local','Alvo / medida (kgf)','Tempo (s)','Desl. (mm)','Resultado'],d.points.map(x=>[x.label,[x.floor,x.location].filter(Boolean).join(' / '),(x.target===''?d.target:x.target)+' / '+x.actual,x.time,x.displacement,result(x)]))+docTable(['Situação','Quantidade'],counts));body+=docChapter('7. Registros de inspeção',d.points.map(x=>'<h3>'+esc(x.label)+' — '+esc([x.floor,x.location].filter(Boolean).join(' / '))+'</h3>'+docKeys([['Antes',x.before],['Após',x.after],['Observações',x.notes]])).join('')||'<p>Nenhum ponto cadastrado.</p>');}
else{body+=docChapter('5. Requisitos de instalação e suporte',d.configs.map(c=>'<h3>'+esc(c.name)+'</h3>'+docKeys([['Diâmetro da haste (mm)',c.diam],['Furo (mm)',c.hole],['Embutimento (mm)',c.hef],['Espessura do suporte (mm)',c.h],['Distância de borda (mm)',c.c],['Espaçamento (mm)',c.s],['Concreto de referência (MPa)',c.fc],['Torque (N·m)',c.torque]])).join('')+'<p class="doc-note">As condições geométricas registradas e a resistência do suporte devem ser confirmadas. A verificação local e global não se confunde com os parâmetros mínimos de catálogo.</p>');body+=docChapter('6. Memorial de cálculo e verificações',d.configs.map(c=>'<h3>'+esc(c.name)+'</h3>'+docKeys([['Classe da haste',c.steel],['Capacidade de trabalho do olhal (kgf)',c.eyeCapacity],['Tração de cálculo Ed (kN)',c.edN],['Cisalhamento de cálculo Ed (kN)',c.edV],['Cálculo externo / revisão',c.external]])+(c.type==='Olhal'?'<p>Área resistente nominal UNC: Aₜ = π/4 × (d − 0,9743 × p)²; p = 25,4 / fios por polegada. Tensão axial nominal: σ = F/Aₜ. Estas expressões não constituem dimensionamento completo do conjunto.</p>':'')+docTable(['Verificação','Resultado'],calc(c).checks)).join(''));body+=docChapter('7. Detalhes construtivos e locação',d.configs.map(c=>'<h3>'+esc(c.name)+'</h3>'+(c.type==='Olhal'?drawing(c):'<p>Desenho específico pendente.</p>')).join('')+docTable(['Etiqueta','Pavimento','Localização','Configuração'],d.points.map(x=>[x.label,x.floor,x.location,d.configs.find(c=>c.id===x.group)?.name||'Pendente']))+'<p>Total cadastrado: '+d.points.length+' ponto(s).</p>');body+=docChapter('8. Orientações de execução e inspeção','<p>'+docText(d.templates.installation||'Executar a instalação segundo a documentação específica do fabricante e o projeto aprovado. Conferir as condições do suporte, procedimento de instalação e critérios de inspeção e ensaio antes da liberação.','Orientações')+'</p>');}
let last=test?8:9;body+=docChapter(last+'. Conclusão e responsabilidade técnica','<p>'+docText(test?d.templates.testConclusion:d.templates.memConclusion,'Conclusão técnica')+'</p><p class="doc-status">'+(test?'Resultados registrados sujeitos à revisão técnica do responsável. Não constitui liberação de uso.':'Dimensionamento completo pendente de validação. A comparação nominal não comprova resistência do conjunto.')+'</p><div class="doc-sign">'+docText(p.engineer,'Responsável técnico')+'<br>CREA '+docText(p.crea,'CREA')+'<br>ART '+docText(d.art,'ART')+'</div>');
let photos=test?d.points.flatMap(x=>x.photos.map((z,i)=>({z,label:x.label+' — Fotografia '+(i+1)}))):[];if(photos.length&&d.templates.showPhotos!=='Não')body+=docChapter((last+1)+'. Registro fotográfico',photos.map(({z,label})=>'<figure class="doc-photo"><img src="'+esc(z.data)+'" alt="'+esc(label)+'"><figcaption>'+esc(label)+' · '+esc(z.name)+'</figcaption></figure>').join(''));let annexN=last+(photos.length&&d.templates.showPhotos!=='Não'?2:1);if(d.annexes.length)body+=docChapter(annexN+'. Anexos',d.annexes.map(a=>'<p>'+esc(a.name)+'</p>'+(a.data.startsWith('data:image/')?'<figure class="doc-photo"><img src="'+esc(a.data)+'"><figcaption>'+esc(a.name)+'</figcaption></figure>':'<p>Arquivo PDF relacionado — juntada separada.</p>')).join(''));
return '<div class="doc-tools no-print">'+btn('Voltar ao preenchimento','back')+btn('Imprimir / salvar PDF','print','primary')+'</div><article class="docbook" data-company="'+esc(p.name)+'"><div class="dochead">'+logo+'<span>'+esc(d.docCode||name)+' · REV '+esc(d.revision)+'</span></div>'+cover+'<div class="doc-source">'+body+'</div></article>'}
async function paginateDocument(){const a=$('preview').querySelector('.docbook');if(!a||a.querySelector('.docpage'))return;await Promise.all([...a.querySelectorAll('img')].map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));if(document.fonts?.ready)await document.fonts.ready;let head=a.querySelector('.dochead'),cover=a.querySelector('.doccover'),source=a.querySelector('.doc-source');let nodes=[...source.children],pages=[],body,page;function next(){page=document.createElement('section');page.className='docpage';page.append(head.cloneNode(true));body=document.createElement('div');body.className='docbody';page.append(body);let foot=document.createElement('div');foot.className='docfoot';page.append(foot);a.append(page);pages.push(page);return body}function fits(){return body.scrollHeight<=body.clientHeight+1}next().append(cover);let toc=next();toc.innerHTML='<h2>Sumário</h2>';next();function add(node){body.append(node);if(fits())return;node.remove();if(body.children.length)next();body.append(node);if(fits())return;if(node.tagName==='TABLE'&&node.tBodies.length){node.remove();let rows=[...node.tBodies[0].rows],t=node.cloneNode(true);t.tBodies[0].replaceChildren();body.append(t);for(let row of rows){t.tBodies[0].append(row);if(!fits()){row.remove();if(!t.tBodies[0].rows.length)t.remove();if(body.children.length)next();t=node.cloneNode(true);t.tBodies[0].replaceChildren(row);body.append(t);if(!fits())page.classList.add('doc-overflow')}}}else{page.classList.add('doc-overflow')}}for(let i=0;i<nodes.length;i++){let n=nodes[i];if(n.matches('h2,h3')&&i+1<nodes.length){let following=nodes[i+1];body.append(n,following);if(fits()){i++;continue}n.remove();following.remove();if(body.children.length)next();add(n);add(following);i++}else add(n)}head.remove();source.remove();for(let h of a.querySelectorAll('h2[data-toc]')){let row=document.createElement('div');row.className='doc-toc-row';let label=document.createElement('span');label.textContent=h.textContent;let no=document.createElement('span');no.textContent=String(pages.indexOf(h.closest('.docpage'))+1);row.append(label,no);toc.append(row)}pages.forEach((p,i)=>{let foot=p.querySelector('.docfoot'),brand=document.createElement('span'),n=document.createElement('span');brand.textContent=a.dataset.company;n.textContent='Página '+(i+1)+' de '+pages.length;foot.append(brand,n)});if(pages.some(p=>p.classList.contains('doc-overflow'))){let warning=document.createElement('p');warning.className='notice no-print';warning.textContent='Há blocos maiores que uma página. Confira a impressão e as quebras antes de emitir.';$('preview').prepend(warning)}}

function settings(){return '<h2>Configurações e biblioteca</h2>'+app.profiles.map((p,i)=>section(p.name,grid(field('Nome da empresa','profiles.'+i+'.name')+field('CNPJ','profiles.'+i+'.cnpj')+field('Endereço','profiles.'+i+'.address')+field('Engenheiro responsável','profiles.'+i+'.engineer')+field('CREA','profiles.'+i+'.crea')+field('Cor institucional','profiles.'+i+'.color','color'))+'<label>Logotipo local <input type="file" accept="image/png,image/jpeg,image/webp" data-logo="'+i+'"></label>'+(p.logo?'<img class="thumb" src="'+esc(p.logo)+'">':''),i===0)).join('')+btn('Adicionar empresa','addprofile')+section('Biblioteca técnica','<p>Referência pré-carregada WQE 500 Plus, com parâmetros nominais ainda sujeitos à validação. Adicione configurações do projeto à biblioteca local.</p>'+app.library.map((c,i)=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+esc(c.maker+' '+c.model)+' · '+esc(c.type)+'</p>'+btn('Usar no projeto','uselib:'+i)+btn('Excluir da biblioteca','dellib:'+i,'danger')+'</div>').join('')+'<div class="actions">'+D().configs.map((c,i)=>btn('Salvar '+c.name,'savelib:'+i)).join('')+'</div>')+'<p class="muted">Dados ficam neste navegador; exporte JSON para transferência e backup. Nenhum dado de obra é enviado ao servidor.</p>'}
function docs(){return '<h2>Documentos salvos</h2><div class="actions">'+btn('Novo projeto','new','primary')+btn('Exportar projeto atual','export')+'<label class="btn">Importar JSON <input type="file" id="import" accept=".json,application/json"></label></div>'+app.docs.map((d,i)=>'<div class="card"><strong>'+esc(d.work||d.name)+'</strong><p>'+esc(d.docCode)+' · REV '+esc(d.revision)+' · '+esc(d.date)+'</p>'+btn('Abrir','open:'+i)+btn('Excluir cópia','deldoc:'+i,'danger')+'</div>').join('')}
function render(){document.documentElement.style.setProperty('--brand',/^#[0-9a-f]{6}$/i.test(P().color)?P().color:'#166344');$('nav').innerHTML=[['mem','Memorial de cálculo'],['test','Relatório de ensaio'],['docs','Documentos salvos'],['settings','Configurações e biblioteca']].map(([v,l])=>'<button class="'+(view===v?'active':'')+'" data-act="nav:'+v+'">'+l+'</button>').join('')+'<span class="status" id="saveStatus">Armazenamento local</span>';$('editor').classList.remove('hide');$('preview').classList.add('hide');$('editor').innerHTML='<div class="notice">REV 02 de testes. Cálculos completos de resistência e identidade institucional ainda pendentes de validação.</div>'+(view==='mem'?memorial():view==='test'?testForm():view==='docs'?docs():settings());if($('dupes'))$('dupes').textContent=duplicateLabels()?'Há etiquetas vazias ou duplicadas. Corrija antes de concluir.':''}
function readFile(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({name:file.name,data:r.result});r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function validImport(d){return d&&d.schema===1&&typeof d.id==='string'&&Array.isArray(d.configs)&&d.configs.length>0&&d.configs.every(c=>c&&typeof c.id==='string')&&Array.isArray(d.points)&&d.points.every(p=>p&&typeof p.label==='string'&&Array.isArray(p.photos))&&Array.isArray(d.annexes)&&d.templates&&typeof d.method==='string'}
function safeData(v){return typeof v==='string'&&/^data:(image\/(png|jpeg|webp|gif)|application\/pdf);base64,[a-z0-9+/=\s]+$/i.test(v)}
function cleanImport(d){let defaults=fresh(),o={...defaults,...d,templates:{...defaults.templates,...d.templates}};for(let k of Object.keys(defaults))if(typeof defaults[k]==='string'&&typeof o[k]!=='string')o[k]=defaults[k];o.configs=d.configs.map(c=>({...preset(),...c}));o.points=d.points.map(p=>{let q={...point(p.label,p.group),...p};for(let k of Object.keys(q))if(k!=='photos'&&typeof q[k]!=='string'&&typeof q[k]!=='number')q[k]='';q.photos=p.photos.filter(x=>x&&safeData(x.data)&&x.data.startsWith('data:image/'));return q});o.annexes=d.annexes.filter(x=>x&&safeData(x.data));return o}
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.bind){set(el.dataset.bind,el.value);if(el.dataset.bind.startsWith('current.configs.')){let i=Number(el.dataset.bind.split('.')[2]);if($('calcs'+i))$('calcs'+i).innerHTML=renderCalc(D().configs[i])}if($('dupes'))$('dupes').textContent=duplicateLabels()?'Há etiquetas vazias ou duplicadas.':''}});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.bind==='current.company'){render();return}if(el.dataset.bind?.endsWith('.type')||el.dataset.bind?.endsWith('.name')){if(el.tagName==='SELECT')render();return}try{if(el.dataset.photo!==undefined){let i=+el.dataset.photo;for(let f of el.files){if(f.size>12*1024*1024)throw Error('Foto acima de 12 MB');let z=await readFile(f);if(!safeData(z.data)||!z.data.startsWith('data:image/'))throw Error('Formato de imagem não aceito');D().points[i].photos.push(z)}save();document.querySelector('dialog')?.remove();pointDetail(i)}else if(el.dataset.logo!==undefined){let f=el.files[0];if(!f)return;let z=await readFile(f);if(!safeData(z.data)||!z.data.startsWith('data:image/'))throw Error('Formato de imagem inválido');app.profiles[+el.dataset.logo].logo=z.data;save();render()}else if(el.id==='attach'){for(let f of el.files){if(f.size>25*1024*1024)throw Error('Anexo acima de 25 MB');let z=await readFile(f);if(!safeData(z.data))throw Error('Formato não aceito');D().annexes.push(z)}save();render()}else if(el.id==='import'){let d=JSON.parse(await el.files[0].text());if(!validImport(d))throw Error('JSON incompatível');if(!confirm('Substituir o projeto atual? Salve antes se necessário.'))return;app.current=cleanImport(d);save();view='mem';render()}}catch(err){save();alert(err.message)}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let [a,i,j]=el.dataset.act.split(':'),d=D();if(a==='nav'){view=i;render();return}if(a==='preview'){if(duplicateLabels()){alert('Corrija as etiquetas duplicadas ou vazias.');return}$('editor').classList.add('hide');$('preview').innerHTML=report(view==='test');$('preview').classList.remove('hide');paginateDocument().catch(e=>alert('Falha na paginação: '+e.message));window.scrollTo(0,0);return}if(a==='back'){render();return}if(a==='print'){paginateDocument().then(()=>window.print()).catch(e=>alert(e.message));return}if(a==='point'){pointDetail(+i);return}if(a==='closeDialog'){document.querySelector('dialog')?.remove();return}if(a==='delphoto'){d.points[+i].photos.splice(+j,1);save();document.querySelector('dialog')?.remove();pointDetail(+i);return}if(a==='addpoints'){let n=Number($('qty').value),prefix=$('prefix').value,floor=$('floor').value,group=$('group').value;if(!Number.isInteger(n)||n<1||n>1000){alert('Informe de 1 a 1000 pontos por lote.');return}let labels=new Set(d.points.map(x=>x.label.trim().toLowerCase())),k=1;for(let l=0;l<n;l++){while(labels.has((prefix+String(k).padStart(3,'0')).toLowerCase()))k++;let label=prefix+String(k++).padStart(3,'0'),p=point(label,group);p.floor=floor;d.points.push(p);labels.add(label.toLowerCase())}}else if(a==='delpoint'){if(!confirm('Excluir este ponto e seus dados do projeto atual?'))return;d.points.splice(+i,1)}else if(a==='addconfig')d.configs.push(preset());else if(a==='delconfig'){if(d.configs.length===1||d.points.some(p=>p.group===d.configs[+i].id)){alert('Configuração em uso ou única.');return}d.configs.splice(+i,1)}else if(a==='picklib'){view='settings'}else if(a==='uselib'){d.configs.push({...structuredClone(app.library[+i]),id:uid()});view='mem'}else if(a==='savelib'){app.library.push({...structuredClone(d.configs[+i]),id:uid()})}else if(a==='dellib'){if(!confirm('Excluir da biblioteca?'))return;app.library.splice(+i,1)}else if(a==='addprofile'){app.profiles.push({id:uid(),name:'Nova empresa',cnpj:'',address:'',engineer:'',crea:'',logo:'',color:'#166344'})}else if(a==='delattach'){d.annexes.splice(+i,1)}else if(a==='saveDoc'){app.docs.push(structuredClone(d));alert('Cópia salva neste dispositivo.')}else if(a==='new'){if(!confirm('Criar projeto novo? Exporte ou salve o atual antes.'))return;app.current=fresh();view='mem'}else if(a==='open'){app.current=structuredClone(app.docs[+i]);view='mem'}else if(a==='deldoc'){if(!confirm('Excluir esta cópia?'))return;app.docs.splice(+i,1)}else if(a==='export'){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),link=document.createElement('a');link.href=url;link.download='ancoragens-'+(d.work||'projeto').replace(/[^a-z0-9_-]/gi,'_')+'-REV'+d.revision+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}save();render()});
(async()=>{try{await openDB();let saved=await read();if(saved&&saved.current&&saved.profiles&&saved.library&&saved.docs)app=saved}catch(e){alert('Armazenamento local indisponível. Exporte JSON para salvar.')}render()})();
</script></body></html>
