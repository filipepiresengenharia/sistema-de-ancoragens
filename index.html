:root{--brand:#166344;--ink:#172a24;--muted:#5c6c64;--line:#d9e3dd;--paper:#fff;--bg:#f2f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,sans-serif;color:var(--ink)}header{background:var(--brand);color:white;padding:20px clamp(16px,4vw,52px)}header h1{margin:0;font-size:23px}header small{opacity:.9}nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px clamp(12px,4vw,52px);background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}button,.btn{font:inherit;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:9px 14px;cursor:pointer}button.primary,nav button.active{background:var(--brand);color:white;border-color:var(--brand)}button.danger{color:#a52d2d}main{max-width:1200px;margin:20px auto;padding:0 16px 60px}h2{margin:0 0 10px;font-size:23px}h3{margin:16px 0 10px;font-size:17px}p{line-height:1.5}small,.muted{color:var(--muted)}.notice{background:#fff5df;border:1px solid #e6c88a;padding:12px;border-radius:8px;margin:12px 0;color:#744c15}.card,details{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}summary{font-weight:650;cursor:pointer}details[open]>summary{margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px;border:1px solid #bccdc4;border-radius:6px;background:white;color:var(--ink)}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:#edf3ee}td input,td select{min-width:88px}.stat{font-weight:700;font-size:20px}.bad{color:#a52d2d}.good{color:#17623b}.pending{color:#8d /* REV 02 — padrão de relatório baseado em PEP Laudos Cremalheira REV 04Q */
.doc-tools{max-width:180mm;margin:12px auto;display:flex;gap:8px;flex-wrap:wrap}
.docbook{--doc-ink:#263b32;font-family:Arial,'Segoe UI',sans-serif;color:var(--doc-ink);font-size:11px;line-height:1.43;max-width:180mm;margin:0 auto}

.doccover .cover-title{margin-top:15mm}.doccover h1{font-size:28px;line-height:1.18;color:var(--brand);margin:3mm 0}.doccover h2{font-size:17px;color:#486359;border:0}.doccover .cover-bottom{margin-top:auto}

.docbook th{background:#edf3ee;color:var(--doc-ink);text-align:left}.docbook .keytable th{width:34%}.docbook thead{display:table-header-group}
.docbook .doc-note{padding:8px;border-left:3px solid var(--brand);background:#f2f6f3;margin:8px 0}.docbook .doc-status{font-size:11px;font-weight:bold;color:#805216;border:1px solid #c9aa68;padding:7px}
.docbook .doc-toc-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted #a9bcb1;padding:5px 0}

.docbook .doc-photo{margin:7px 0;break-inside:avoid}.docbook .doc-photo img{display:block;width:auto;max-width:100%;height:auto;max-height:115mm;object-fit:contain}.docbook .doc-photo figcaption{font-size:10px;margin:4px 0}

.docbook .doc-overflow{height:auto;min-height:260mm}.docbook .doc-overflow .docbody{flex:none}

@media print{@page{size:A4;margin:18mm 15mm 19mm}main,#preview{width:180mm!important;max-width:none!important;overflow:visible!important}.doc-tools{display:none!important}.docbook{margin:0!important}.docpage{margin:0!important;outline:0;box-shadow:none;height:260mm;break-after:page;page-break-after:always}.docpage:last-child{break-after:auto;page-break-after:auto}.docpage.doc-overflow{height:auto;min-height:0;break-inside:auto}.docbook tr,.docbook figure{break-inside:avoid}}
.doc-editor-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}.outline-panel{position:sticky;top:75px;max-height:75vh;overflow:auto}.chapter-row{display:flex;align-items:center;gap:8px;text-align:left;width:100%;border:0;background:white;margin:3px 0;padding:8px;font-size:12px}.chapter-row.selected{background:#e2f0ea;color:var(--brand);font-weight:700}.chapter-no{min-width:24px;color:var(--brand);font-weight:700}.chapter-row i{flex:none;margin-left:auto;width:7px;height:7px;border-radius:50%;background:#d5a444}.chapter-row i.done{background:#16834b}.chapter-panel{min-width:0}.chapter-panel textarea{min-height:260px;font:14px/1.6 'Segoe UI',Arial,sans-serif}.tag-toolbar{background:#f0f5f3;border:1px solid var(--line);border-radius:8px;padding:9px;margin:14px 0}.tag-toolbar button{font-size:12px;padding:6px 8px}.tag-toolbar select{width:auto;max-width:100%;font-size:13px}.live-doc{border:1px solid var(--line);border-radius:7px;padding:14px;background:#fff;overflow:auto;margin-top:15px}.live-doc p{white-space:pre-wrap}.live-doc .doc-missing{color:#9a651a;background:#fff2d1}.live-doc svg{max-width:500px}.docbook .doc-toc-row{padding:3px 0;font-size:10.5px}@media(max-width:760px){.doc-editor-layout{grid-template-columns:1fr}.outline-panel{position:relative;top:0;max-height:220px}}</style></head><body><header><h1>Sistema de Ancoragens</h1><small>REV 04 · ambiente de testes · memorial, caderno técnico e ensaio</small></header><nav id="nav"></nav><main><div id="editor"></div><div id="preview" class="hide"></div></main>
<script>
'use strict';
const REV='04',SOURCE='https://walsywa.com.br/wp-content/uploads/2026/03/Catalogo-geral-walsywa-2026.pdf';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),today=()=>new Date().toLocaleDateString('sv-SE'),num=v=>v!==''&&v!==null&&v!==undefined&&Number.isFinite(Number(v))?Number(v):null,fmt=(v,d=2)=>Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';
const preset=()=>({id:uid(),name:'Olhal 1/2″ — conjunto usual',type:'Olhal',fix:'Química',maker:'Walsywa',model:'WQE 500 Plus',eye:'Inox AISI 316',rod:'Inox AISI 316',diam:12.7,tpi:13,hole:14,hef:110,h:140,c:45,s:60,fc:30,torque:35,ultimate:8365,required:1500,source:SOURCE,steel:'',eyeCapacity:'',edN:'',edV:'',external:'',notes:''});
const profiles=()=>[{id:'bras',name:'Brasmetal',cnpj:'',address:'Guarapari – ES',engineer:'',crea:'',logo:'',color:'#166344'},{id:'pep',name:'Pepes Engenharia',cnpj:'',address:'',engineer:'',crea:'',logo:'',color:'#204b75'}];
const point=(label,group)=>({id:uid(),label,group,floor:'',location:'',target:'',actual:'',time:'',displacement:'',before:'',after:'',result:'Pendente',notes:'',photos:[]});
function fresh(){return {schema:1,id:uid(),name:'Novo projeto',company:'bras',client:'',work:'',address:'',art:'',project:'',docCode:'',revision:'00',date:today(),purpose:'Proteção individual contra quedas',configs:[preset()],points:[],equipment:'',calibration:'',method:'',target:'',duration:'',limit:'',direction:'Tração axial',accept:'',annexes:[],templates:{memIntro:'O presente memorial estabelece as características da ancoragem e as condições mínimas exigidas do suporte.',testIntro:'O relatório registra as condições observadas e os resultados individuais dos ensaios realizados.',scope:'A verificação da estrutura global do edifício compete ao responsável técnico estrutural. O ensaio não substitui o dimensionamento.',memConclusion:'',testConclusion:'',revisionDescription:'Emissão inicial',references:'',installation:'',showPhotos:'Sim'}}}
let db,app={profiles:profiles(),library:[preset()],docs:[],current:fresh()},view='mem',timer;
function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('ancoragens-rev00',1);q.onupgradeneeded=()=>q.result.createObjectStore('state');q.onsuccess=()=>{db=q.result;resolve()};q.onerror=()=>reject(q.error)})}
function read(){return new Promise((resolve,reject)=>{let q=db.transaction('state').objectStore('state').get('app');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function save(){clearTimeout(timer);timer=setTimeout(()=>{if(!db)return;try{let t=db.transaction('state','readwrite');t.objectStore('state').put(app,'app');t.oncomplete=()=>{if($('saveStatus'))$('saveStatus').textContent='Salvo neste dispositivo'};t.onerror=()=>{if($('saveStatus'))$('saveStatus').textContent='Falha no salvamento — exporte JSON'}}catch(e){alert('Falha no armazenamento: '+e.message)}},180)}
const D=()=>app.current,P=()=>app.profiles.find(p=>p.id===D().company)||app.profiles[0];
function get(path){return path.split('.').reduce((o,k)=>o?.[k],app)}
function set(path,value){let keys=path.split('.'),key=keys.pop(),o=keys.reduce((o,k)=>o[k],app);o[key]=value;save()}
function field(label,path,type='text',opts=[],hint=''){let v=get(path);let attrs=' data-bind="'+esc(path)+'"';let control=type==='select'?'<select'+attrs+'>'+opts.map(o=>{let a=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a[0])+'" '+(String(a[0])===String(v)?'selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select>':type==='textarea'?'<textarea'+attrs+'>'+esc(v)+'</textarea>':'<input type="'+type+'"'+(type==='number'?' step="any"':'')+attrs+' value="'+esc(v)+'">';return '<label class="field">'+esc(label)+control+(hint?'<small>'+esc(hint)+'</small>':'')+'</label>'}
const section=(title,body,open=true)=>'<details '+(open?'open':'')+'><summary>'+esc(title)+'</summary>'+body+'</details>',grid=s=>'<div class="grid">'+s+'</div>',f=(l,k,t='text',o=[],h='')=>field(l,'current.'+k,t,o,h),btn=(label,action,cls='')=>'<button type="button" class="'+cls+'" data-act="'+action+'">'+esc(label)+'</button>';
const MODES=['mem','tech','test'],DOC_NAMES={mem:'Memorial de cálculo',tech:'Caderno técnico',test:'Relatório de ensaio de carga'};
function modeNow(){return view==='docedit'?docMode:MODES.includes(view)?view:'mem'}
function initMeta(d){if(!d.docMeta||typeof d.docMeta!=='object'||Array.isArray(d.docMeta))d.docMeta={};for(const mode of MODES){const old=mode==='mem'||Array.isArray(d.docModels?.[mode]);const defaults={code:old?d.docCode||'':'',revision:old?d.revision||'00':'00',date:old?d.date||today():'',art:old?d.art||'':'',description:old?d.templates?.revisionDescription||'Emissão inicial':'Emissão inicial'};const current=d.docMeta[mode];d.docMeta[mode]=Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,typeof current?.[k]==='string'?current[k]:v]));}return d.docMeta}
function meta(mode=modeNow()){return initMeta(D())[mode]}
function identification(){let mode=modeNow();meta(mode);let m=(label,k,t='text')=>field(label,'current.docMeta.'+mode+'.'+k,t);return section('1. Identificação',grid(f('Empresa emissora','company','select',app.profiles.map(p=>[p.id,p.name]))+f('Cliente / contratante','client')+f('Obra','work')+f('Endereço da obra','address')+f('Projeto / prancha','project')+m('ART do documento','art')+m('Código do documento','code')+m('Revisão','revision')+m('Data de emissão','date','date')+f('Finalidade','purpose'))+'<p class="muted">Dados institucionais no menu Configurações. Preenchimento automático após cadastro do perfil.</p>')}
function calc(c){let d=num(c.diam),tpi=num(c.tpi),effective=d>0&&Number.isInteger(tpi)&&tpi>0?d-.9743*25.4/tpi:null,area=c.type==='Olhal'&&effective>0?Math.PI/4*Math.pow(effective,2):null,req=num(c.required),force=req>0?req*9.80665:null,stress=area>0&&force!==null?force/area:null;let standard=c.type==='Olhal'&&c.fix==='Química'&&c.maker==='Walsywa'&&c.model==='WQE 500 Plus'&&d===12.7&&tpi===13;let checks=[['Tipo e método',c.type==='Olhal'?'Olhal — verificações preliminares':'Metodologia específica pendente'],['Área nominal da rosca',area===null?'Pendente':fmt(area)+' mm² (UNC; confirmar rosca)'],['Tensão axial nominal',stress===null?'Pendente':fmt(stress)+' MPa (carga requerida, não Ed)']];if(standard){let geometry=[num(c.hole)===14,num(c.hef)===110,num(c.h)>=140,num(c.c)>=45,num(c.s)>=60,num(c.fc)>=30];checks.push(['Geometria de referência WQE 500 Plus',geometry.every(Boolean)?'Compatível com referência nominal — não valida resistência':'Pendente ou divergente da referência nominal'],['Carga última de catálogo',num(c.ultimate)===8365?'8.365 kgf — referência nominal':'Valor alterado; comprovação necessária'])}checks.push(['Capacidade do conjunto','Pendente — resistência local, classe da haste, olhal e ações de cálculo não validadas']);return {area,stress,checks}}
function drawing(c){let hef=num(c.hef),h=num(c.h),hole=num(c.hole);return '<svg viewBox="0 0 480 205" role="img" aria-label="Corte esquemático de olhal e fixação"><rect x="155" y="45" width="285" height="116" fill="#dbe5dd" stroke="#8a9e91"/><rect x="155" y="91" width="210" height="24" fill="#c9aa77"/><rect x="118" y="97" width="242" height="12" fill="#667b83"/><circle cx="92" cy="103" r="28" fill="none" stroke="#667b83" stroke-width="12"/><g stroke="#364f44" fill="none"><path d="M155 165v18M365 165v18M155 177h210M440 45v-18M155 45v-18M155 32h285M370 91h20M370 115h20M385 91v24"/></g><g font-size="12" fill="#172a24"><text x="204" y="26">h = '+esc(h??'—')+' mm</text><text x="205" y="195">hef = '+esc(hef??'—')+' mm</text><text x="395" y="85">Ø '+esc(hole??'—')+'</text><text x="10" y="15">Corte esquemático — sem escala</text><text x="12" y="157">Olhal</text><text x="248" y="72">Concreto</text></g></svg>'}
function configFields(c,i){let base='current.configs.'+i+'.',a=(l,k,t='text',o=[],h='')=>field(l,base+k,t,o,h);return '<div class="card"><div class="actions"><strong>'+esc(c.name)+'</strong>'+btn('Remover','delconfig:'+i,'danger')+'</div>'+grid(a('Nome da configuração','name')+a('Tipo de dispositivo','type','select',['Olhal','Vergalhão caranguejo','Vergalhão em U'])+a('Tipo de fixação','fix','select',['Química','Mecânica','Outro'])+a('Fabricante','maker')+a('Modelo','model')+a('Olhal / material','eye')+a('Haste / material','rod')+a('Carga requerida (kgf)','required','number'))+section('Dimensões e dados técnicos',grid(a('Diâmetro da haste (mm)','diam','number')+a('Fios por polegada (UNC)','tpi','number')+a('Diâmetro do furo (mm)','hole','number')+a('Embutimento efetivo (mm)','hef','number')+a('Espessura do suporte (mm)','h','number')+a('Borda mínima real (mm)','c','number')+a('Espaçamento mínimo real (mm)','s','number')+a('Concreto de referência (MPa)','fc','number')+a('Torque (N·m)','torque','number')+a('Carga última de referência (kgf)','ultimate','number')+a('Classe da haste / comprovante','steel')+a('Carga de trabalho do olhal (kgf)','eyeCapacity','number')+a('Tração de cálculo Ed (kN)','edN','number')+a('Cisalhamento de cálculo Ed (kN)','edV','number')+a('Fonte técnica','source')+a('Cálculo externo / revisão','external')+a('Observações','notes','textarea')),false)+'<div id="calcs'+i+'">'+renderCalc(c)+'</div></div>'}
function renderCalc(c){return (c.type==='Olhal'?drawing(c):'<div class="notice">Desenho e cálculo específico aguardam memorial de referência.</div>')+'<table>'+calc(c).checks.map(r=>'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>'}
function pointTable(test){let p=D().points;return section(test?'4. Pontos e resultados':'3. Pontos e etiquetas','<div class="actions"><label>Quantidade <input id="qty" type="number" min="1" max="1000" value="1"></label><label>Prefixo <input id="prefix" value="PA-"></label><label>Pavimento <input id="floor"></label><label>Configuração <select id="group">'+D().configs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select></label>'+btn('Adicionar pontos','addpoints','primary')+'</div><p class="muted">'+p.length+' ponto(s). Etiquetas não são renumeradas ao excluir pontos.</p><div class="tablewrap"><table><thead><tr><th>Etiqueta</th><th>Pavimento</th><th>Localização</th><th>Configuração</th>'+(test?'<th>Carga medida (kgf)</th><th>Tempo (s)</th><th>Deslocamento (mm)</th><th>Resultado</th><th>Detalhes</th>':'')+'<th></th></tr></thead><tbody>'+p.map((x,i)=>{let a=(l,k,t='text',o=[])=>field(l,'current.points.'+i+'.'+k,t,o);return '<tr><td>'+a('','label')+'</td><td>'+a('','floor')+'</td><td>'+a('','location')+'</td><td>'+a('','group','select',D().configs.map(c=>[c.id,c.name]))+'</td>'+(test?'<td>'+a('','actual','number')+'</td><td>'+a('','time','number')+'</td><td>'+a('','displacement','number')+'</td><td>'+a('','result','select',['Pendente','Aprovado','Reprovado'])+'</td><td>'+btn('Editar','point:'+i)+'</td>':'')+'<td>'+btn('Excluir','delpoint:'+i,'danger')+'</td></tr>'}).join('')+'</tbody></table></div><p id="dupes" class="bad"></p>')}
function pointDetail(i){let x=D().points[i],a=(l,k,t='text')=>field(l,'current.points.'+i+'.'+k,t);let dialog=document.createElement('dialog');dialog.style='max-width:680px;width:92%;border:1px solid #ccd9d0;border-radius:10px;padding:20px';dialog.innerHTML='<h3>Ponto '+esc(x.label)+'</h3>'+grid(a('Carga alvo específica (kgf)','target','number')+a('Condições antes do ensaio','before','textarea')+a('Condições após o ensaio','after','textarea')+a('Observações','notes','textarea'))+'<label>Fotos do ponto <input type="file" accept="image/*" multiple data-photo="'+i+'"></label><div>'+x.photos.map((z,j)=>'<img class="thumb" src="'+esc(z.data)+'" alt="Foto '+(j+1)+'">'+btn('Remover','delphoto:'+i+':'+j)).join('')+'</div><div class="actions">'+btn('Fechar','closeDialog','primary')+'</div>';document.body.append(dialog);dialog.showModal()}
function annexes(){return section('Projetos, catálogos e anexos','<input type="file" id="attach" multiple accept="application/pdf,image/*"><p class="muted">Anexos são armazenados no dispositivo e incluídos no JSON. Imagens entram na prévia; PDFs são relacionados para juntada separada nesta revisão.</p>'+D().annexes.map((a,i)=>'<div class="actions">'+esc(a.name)+btn('Remover','delattach:'+i,'danger')+'</div>').join(''),false)}
function template(test){return section('Modelo e opções do documento','<p>Edite a estrutura completa, os capítulos, subtópicos e as tags no editor documental.</p>'+btn('Abrir editor documental','doceditor','primary')+grid(field('Descrição da revisão','current.docMeta.'+modeNow()+'.description','textarea')+(test?f('Incluir fotografias','templates.showPhotos','select',['Sim','Não']):'')),false)}
function memorial(){return '<h2>Memorial de cálculo</h2>'+identification()+section('2. Configuração da ancoragem',D().configs.map(configFields).join('')+'<div class="actions">'+btn('Nova configuração','addconfig')+btn('Adicionar da biblioteca','picklib')+'</div>')+pointTable(false)+annexes()+template(false)+toolbar()}
function technical(){return '<h2>Caderno técnico</h2>'+identification()+section('2. Especificações e configurações',D().configs.map(configFields).join('')+'<div class="actions">'+btn('Nova configuração','addconfig')+btn('Adicionar da biblioteca','picklib')+'</div>')+pointTable(false)+annexes()+template(false)+toolbar()}
function testForm(){return '<h2>Relatório de ensaio</h2>'+identification()+section('2. Equipamentos e calibração',grid(f('Equipamento / identificação','equipment','textarea')+f('Certificado de calibração / validade','calibration','textarea')))+section('3. Procedimento de ensaio',grid(f('Carga alvo geral (kgf)','target','number')+f('Tempo mínimo de aplicação (s)','duration','number')+f('Limite de deslocamento (mm)','limit','number')+f('Direção da carga','direction')+f('Procedimento e referência','method','textarea')+f('Critérios de aceitação','accept','textarea'))+'<p class="muted">A carga de ensaio é independente da carga requerida no memorial. Defina critérios conforme procedimento validado.</p>')+pointTable(true)+annexes()+template(true)+toolbar()}
function toolbar(){return '<div class="actions no-print">'+btn('Salvar cópia do projeto','saveDoc')+btn('Exportar JSON','export')+btn('Editor documental por tags','doceditor','primary')+btn('Visualizar relatório','preview')+'</div>'}
function duplicateLabels(){let a=D().points.map(p=>p.label.trim().toLowerCase());return a.some((x,i)=>!x||a.indexOf(x)!==i)}
function result(p){let d=D(),a=num(p.actual),target=p.target===''||p.target===null||p.target===undefined?num(d.target):num(p.target),t=num(p.time),min=num(d.duration),disp=num(p.displacement),lim=num(d.limit);if(p.result==='Reprovado')return 'Reprovado';if(duplicateLabels()||!d.equipment.trim()||!d.calibration.trim()||!d.method.trim()||!d.accept.trim()||!p.before.trim()||!p.after.trim()||!(target>0)||!(min>0)||lim===null||lim<0||a===null||t===null||disp===null||disp<0)return 'Pendente';if(a<target||t<min||disp>lim)return 'Reprovado';return p.result==='Aprovado'?'Aprovado':'Pendente'}
function table(rows){return '<table>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>'}
function docText(v,tag){return String(v??'').trim()?esc(v):'<span class="doc-missing">'+esc(tag||'A preencher')+'</span>'}
function docKeys(rows){return '<table class="keytable"><tbody>'+rows.map(([k,v])=>'<tr><th>'+esc(k)+'</th><td>'+docText(v,k)+'</td></tr>').join('')+'</tbody></table>'}
function docTable(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+docText(v,'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function docChapter(title,html){return '<h2 data-toc="1">'+esc(title)+'</h2>'+html}
// REV 03 — editor documental hierárquico inspirado no editor APR Cremalheira.
let docMode='mem',activeChapter='',chapterQuery='';
const tagChapter=(title,text='',children=[],condition='')=>({id:uid(),title,text,children,reviewed:false,condition});
function seedDocument(mode){const n=tagChapter,t=D().templates;const list=[
n('IDENTIFICAÇÃO','{{TABELA_IDENTIFICACAO}}\n{{TABELA_REVISOES}}'),
n('OBJETIVO E ESCOPO',mode==='mem'?'Este memorial apresenta as premissas, ações e verificações de resistência dos dispositivos de ancoragem previstos para {{OBRA_NOME}}, considerando a configuração cadastrada e os documentos de referência. A finalidade prevista é {{ANCORAGEM_FINALIDADE}}. O dimensionamento local da fixação deve considerar o dispositivo, a haste ou elemento de ligação e o material de suporte. A verificação global da estrutura do edifício compete ao responsável técnico estrutural.':mode==='tech'?'Este caderno estabelece as especificações técnicas e as orientações de execução dos pontos de ancoragem de {{OBRA_NOME}}, destinados a {{ANCORAGEM_FINALIDADE}}. Identifica os materiais, as condições de instalação e os detalhes construtivos de referência. Não substitui o dimensionamento, as instruções do fabricante nem a conferência das condições reais de montagem.':'Este relatório destina-se a documentar os ensaios de carga dos pontos de ancoragem de {{OBRA_NOME}}, vinculando as medições e observações à identificação individual de cada dispositivo. O escopo limita-se aos pontos efetivamente avaliados e às condições do procedimento registrado. O ensaio não substitui a verificação de resistência de projeto nem comprova, isoladamente, a segurança global da estrutura.'),
n('REFERÊNCIAS TÉCNICAS','Adotar os requisitos da NR-18 e da NR-35, Anexo II, conforme o enquadramento da instalação, e as normas técnicas aplicáveis ao tipo de dispositivo, incluindo a ABNT NBR 16325-1 quando pertinente. A documentação do fabricante deve corresponder ao produto efetivamente utilizado. Os critérios de projeto, instalação ou ensaio devem ser confirmados pelo responsável técnico.\n{{FONTES_TECNICAS}}'+(t.references?'\n'+t.references:'')),
n('CARACTERIZAÇÃO DAS ANCORAGENS','As configurações a seguir identificam os dispositivos e seus elementos de ligação. Os parâmetros declarados em catálogo não representam, por si só, capacidade de trabalho comprovada do conjunto instalado.\n{{TABELA_DISPOSITIVOS}}')];
if(mode==='mem')list.push(
n('PREMISSAS DE DIMENSIONAMENTO','A carga requerida por ponto é informada para cada configuração. Devem ser consideradas as direções de solicitação, as combinações de ações, a eventual simultaneidade e as condições do suporte. A carga de ensaio não é automaticamente uma ação de dimensionamento. A resistência de trabalho do dispositivo não deve ser confundida com a carga última de ruptura.\n{{TABELA_GEOMETRIA}}'),
n('MEMORIAL DE CÁLCULO','A análise é realizada por configuração. As verificações nominais apresentadas devem ser complementadas pelos critérios de resistência do fabricante e pela documentação de cálculo aplicável.',[
n('Equações e resultados','{{MEMORIA_CALCULO}}'),
n('Verificação do conjunto','A condição de resistência exige que as solicitações de cálculo não excedam as resistências de cálculo correspondentes, inclusive na interação entre tração e cisalhamento quando aplicável. Devem ser avaliados o olhal, a haste, a ligação roscada, a aderência ou mecanismo de fixação, a ruptura do concreto e a influência de bordas, espaçamentos e fissuração. A resistência nominal de catálogo não substitui essas verificações.\n{{TABELA_VERIFICACOES}}')]),
n('LOCAÇÃO E REQUISITOS DO SUPORTE','As etiquetas identificam os pontos previstos. A posição definitiva deve ser compatibilizada com o projeto, dimensões reais, armaduras e interferências. Cabe ao responsável pela estrutura comprovar a resistência do elemento de suporte às ações transmitidas.\n{{TABELA_PONTOS}}\nTotal cadastrado: {{PONTOS_TOTAL}} ponto(s).'),
n('CONCLUSÃO TÉCNICA','Os resultados apresentados caracterizam as verificações disponíveis para as configurações cadastradas. A conclusão sobre atendimento depende da comprovação das resistências do dispositivo, ligação, fixação e suporte, e da validação das ações de projeto pelo responsável técnico.'+(t.memConclusion?'\n'+t.memConclusion:'')));
if(mode==='tech')list.push(
n('ESPECIFICAÇÕES DE INSTALAÇÃO','Os parâmetros geométricos abaixo constituem requisitos de referência a conferir com o projeto e com a ficha técnica do produto selecionado. Confirmar resistência e natureza do suporte, dimensões, bordas, espaçamentos, profundidade e compatibilidade dos materiais. Não substituir componentes sem avaliação técnica.\n{{TABELA_GEOMETRIA}}'),
n('DETALHES CONSTRUTIVOS E LOCAÇÃO','Os desenhos são esquemáticos e não estão em escala. As dimensões do cadastro e as pranchas aprovadas prevalecem sobre a representação gráfica. Identificar cada ponto pela etiqueta correspondente.\n{{DESENHOS_TECNICOS}}\n{{TABELA_PONTOS}}\nTotal cadastrado: {{PONTOS_TOTAL}} ponto(s).'),
n('PROCEDIMENTO DE EXECUÇÃO','Conferir a posição de cada ponto e as condições do suporte antes da execução. Evitar interferência com armaduras e instalações; divergências devem ser submetidas à avaliação técnica. Em fixações químicas, observar o diâmetro e a profundidade de perfuração, limpeza do furo, preparo e aplicação do produto, temperatura, tempo de cura e torque especificados pelo fabricante. Em fixações mecânicas, seguir as instruções próprias do sistema selecionado. Para dispositivos de vergalhão, observar os detalhes de fabricação e ancoragem do projeto específico. Não aplicar carga antes de atendidas as condições de montagem e cura.'+(t.installation?'\n'+t.installation:'')),
n('INSPEÇÃO E IDENTIFICAÇÃO','Conferir a identificação, a integridade, o assentamento e a correspondência entre o dispositivo instalado e as especificações. Registrar alterações, não conformidades e documentos de fornecimento. Proteger os componentes contra condições incompatíveis com seus materiais. A utilização depende das verificações e inspeções exigidas para a aplicação, sem obrigatoriedade de emitir outro documento pelo presente sistema.'),
n('DOCUMENTAÇÃO COMPLEMENTAR','As fichas técnicas, catálogos, desenhos e instruções aplicáveis devem acompanhar o caderno quando disponíveis. Anexos em PDF relacionados pelo sistema devem ser juntados ao documento final.'));
if(mode==='test')list.push(
n('INSTRUMENTAÇÃO','A identificação do equipamento e sua calibração devem permitir rastrear as medições. A faixa e a adequação do instrumento à carga prevista, bem como as condições do sistema de reação, devem ser verificadas antes dos ensaios.\n{{TABELA_INSTRUMENTOS}}'),
n('METODOLOGIA DO ENSAIO','Identificar o ponto, inspecionar suas condições iniciais, posicionar o dispositivo de aplicação de carga e o sistema de reação conforme o procedimento validado. Aplicar a carga de forma controlada na direção prevista, registrar carga, duração e deslocamento conforme os critérios estabelecidos, descarregar e inspecionar novamente o conjunto. Registrar interrupções, danos, movimentos ou outras ocorrências relevantes.\nDireção prevista: {{ENSAIO_DIRECAO}}.\nProcedimento específico: {{ENSAIO_PROCEDIMENTO}}'),
n('CRITÉRIOS DE ACEITAÇÃO','O resultado individual deve observar a carga alvo aplicável ao ponto, o tempo mínimo, o limite de deslocamento e as condições visuais e funcionais estabelecidas pelo procedimento. Não atribuir aprovação a pontos sem evidências suficientes. Cargas, tempos e limites não são universais e devem ser definidos pelo responsável técnico.\nCritérios específicos: {{ENSAIO_CRITERIOS}}'),
n('RESULTADOS INDIVIDUAIS','A tabela relaciona os pontos cadastrados por etiqueta, incluindo os resultados medidos e a classificação registrada. Pontos pendentes não representam ensaios aprovados.\n{{TABELA_RESULTADOS}}\n{{TABELA_RESUMO}}'),
n('REGISTROS DE INSPEÇÃO','As condições anteriores e posteriores ao carregamento, bem como as ocorrências observadas, são registradas individualmente.\n{{REGISTROS_INSPECAO}}'),
n('CONCLUSÃO TÉCNICA','A conclusão é restrita às condições de ensaio e aos pontos identificados neste relatório. Os pontos classificados como reprovados ou pendentes não devem ser considerados aprovados. A disposição das não conformidades e a eventual repetição dos ensaios devem ser definidas pelo responsável técnico.'+(t.testConclusion?'\n'+t.testConclusion:'')),
n('REGISTRO FOTOGRÁFICO','{{REGISTRO_FOTOGRAFICO}}',[],'photos'));
list.push(n('ANEXOS','{{ANEXOS_DOCUMENTAIS}}',[],'annexes'));return list}
function normalChapters(nodes,depth=0,used=new Set()){if(!Array.isArray(nodes)||depth>12)return [];return nodes.filter(n=>n&&typeof n==='object').map(n=>{let id=typeof n.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(n.id)&&!used.has(n.id)?n.id:uid();used.add(id);return {id,title:String(n.title||'Novo capítulo'),text:typeof n.text==='string'?n.text:'',reviewed:n.reviewed===true,condition:['photos','annexes'].includes(n.condition)?n.condition:'',children:normalChapters(n.children,depth+1,used)}})}
function ensureDocument(mode=docMode){let d=D();if(!d.docModels||typeof d.docModels!=='object')d.docModels={};if(!Array.isArray(d.docModels[mode])){d.docModels[mode]=Array.isArray(app.docDefaults?.[mode])?normalChapters(structuredClone(app.docDefaults[mode])):seedDocument(mode);save()}return d.docModels[mode]}
function walkDoc(nodes,fn,prefix='',depth=0){nodes.forEach((n,i)=>{let no=prefix?prefix+'.'+(i+1):String(i+1);fn(n,no,depth,nodes,i);walkDoc(n.children||[],fn,no,depth+1)})}
function findDoc(id){let found=null;walkDoc(ensureDocument(),(n,no,depth,arr,i)=>{if(n.id===id)found={n,no,depth,arr,i}});return found}
function docTagValues(){let d=D(),p=P(),m=meta();return {EMPRESA_RAZAO:p.name,EMPRESA_CNPJ:p.cnpj,EMPRESA_ENDERECO:p.address,CLIENTE_RAZAO:d.client,OBRA_NOME:d.work,OBRA_ENDERECO:d.address,PROJETO_REFERENCIA:d.project,DOCUMENTO_NUMERO:m.code,DOCUMENTO_REVISAO:m.revision,DATA_EMISSAO:m.date,ENGENHEIRO_NOME:p.engineer,ENGENHEIRO_CREA:p.crea,ART_NUMERO:m.art,ANCORAGEM_FINALIDADE:d.purpose,PONTOS_TOTAL:d.points.length,ENSAIO_CARGA:d.target,ENSAIO_TEMPO:d.duration,ENSAIO_DESLOCAMENTO:d.limit,ENSAIO_DIRECAO:d.direction,ENSAIO_PROCEDIMENTO:d.method,ENSAIO_CRITERIOS:d.accept,INSTRUMENTO_IDENTIFICACAO:d.equipment,INSTRUMENTO_CALIBRACAO:d.calibration}}
const BLOCK_TAGS=['TABELA_IDENTIFICACAO','TABELA_REVISOES','FONTES_TECNICAS','TABELA_DISPOSITIVOS','TABELA_GEOMETRIA','MEMORIA_CALCULO','TABELA_VERIFICACOES','DESENHOS_TECNICOS','TABELA_PONTOS','TABELA_INSTRUMENTOS','TABELA_RESULTADOS','TABELA_RESUMO','REGISTROS_INSPECAO','REGISTRO_FOTOGRAFICO','ANEXOS_DOCUMENTAIS'];
function docBlock(k){let d=D(),p=P(),m=meta(),cs=d.configs,points=d.points;let groups=fn=>cs.map(c=>'<h3>'+esc(c.name)+'</h3>'+fn(c)).join('');switch(k){
case 'TABELA_IDENTIFICACAO':return docKeys([['Contratante',d.client],['Obra',d.work],['Endereço',d.address],['Projeto',d.project],['Documento',m.code],['ART',m.art],['Emissão',m.date],['Responsável técnico',p.engineer],['CREA',p.crea],['Finalidade',d.purpose]]);
case 'TABELA_REVISOES':return docTable(['Revisão','Data','Descrição','Elaboração'],[[m.revision,m.date,m.description,p.engineer]]);
case 'FONTES_TECNICAS':return cs.map(c=>'<p><b>'+esc(c.name)+':</b> '+docText(c.source,'Fonte técnica')+'</p>').join('');
case 'TABELA_DISPOSITIVOS':return groups(c=>docKeys([['Tipo',c.type],['Fixação',c.fix],['Fabricante / modelo',c.maker+' / '+c.model],['Olhal',c.eye],['Haste',c.rod],['Carga requerida (kgf)',c.required],['Fonte',c.source]]));
case 'TABELA_GEOMETRIA':return groups(c=>docKeys([['Diâmetro haste (mm)',c.diam],['Furo (mm)',c.hole],['Embutimento (mm)',c.hef],['Espessura suporte (mm)',c.h],['Borda (mm)',c.c],['Espaçamento (mm)',c.s],['Concreto (MPa)',c.fc],['Torque (N·m)',c.torque]]));
case 'MEMORIA_CALCULO':return groups(c=>c.type==='Olhal'?'<p>Carga requerida: '+fmt(num(c.required))+' kgf; conversão F = carga × 9,80665 = '+fmt(num(c.required)>0?num(c.required)*9.80665/1000:null,3)+' kN. Diâmetro nominal: '+fmt(num(c.diam))+' mm; fios por polegada: '+fmt(num(c.tpi))+'; passo p = '+fmt(num(c.tpi)>0?25.4/num(c.tpi):null,3)+' mm.</p><p>Área resistente nominal UNC: Aₜ = π/4 × (d − 0,9743 × p)²; p = 25,4 / fios por polegada. Tensão axial nominal: σ = F/Aₜ.</p><p>Área nominal: '+fmt(calc(c).area)+' mm²; tensão nominal: '+fmt(calc(c).stress)+' MPa. Estas expressões não comprovam a capacidade do conjunto.</p>':'<p>Metodologia específica pendente.</p>');
case 'TABELA_VERIFICACOES':return groups(c=>docKeys([['Classe da haste',c.steel],['Carga de trabalho do olhal (kgf)',c.eyeCapacity],['Tração de cálculo Ed (kN)',c.edN],['Cisalhamento Ed (kN)',c.edV],['Cálculo externo',c.external]])+docTable(['Verificação','Resultado'],calc(c).checks));
case 'DESENHOS_TECNICOS':return groups(c=>c.type==='Olhal'?drawing(c):'<p>Desenho específico pendente.</p>');
case 'TABELA_PONTOS':return docTable(['Etiqueta','Pavimento','Localização','Configuração'],points.map(x=>[x.label,x.floor,x.location,cs.find(c=>c.id===x.group)?.name||'Pendente']));
case 'TABELA_INSTRUMENTOS':return docKeys([['Equipamento',d.equipment],['Calibração',d.calibration],['Carga geral (kgf)',d.target],['Tempo mínimo (s)',d.duration],['Limite de deslocamento (mm)',d.limit],['Direção',d.direction]]);
case 'TABELA_RESULTADOS':return docTable(['Etiqueta','Pavimento / local','Alvo / medida (kgf)','Tempo (s)','Desl. (mm)','Resultado'],points.map(x=>[x.label,[x.floor,x.location].filter(Boolean).join(' / '),(x.target===''?d.target:x.target)+' / '+x.actual,x.time,x.displacement,result(x)]));
case 'TABELA_RESUMO':return docTable(['Situação','Quantidade'],['Aprovado','Reprovado','Pendente'].map(s=>[s,points.filter(x=>result(x)===s).length]));
case 'REGISTROS_INSPECAO':return points.map(x=>'<h3>'+esc(x.label)+'</h3>'+docKeys([['Antes',x.before],['Após',x.after],['Observações',x.notes]])).join('')||'<p>Nenhum ponto cadastrado.</p>';
case 'REGISTRO_FOTOGRAFICO':return points.flatMap(x=>x.photos.map((z,i)=>'<figure class="doc-photo"><img src="'+esc(z.data)+'" alt="'+esc(x.label)+'"><figcaption>'+esc(x.label)+' — Fotografia '+(i+1)+' · '+esc(z.name)+'</figcaption></figure>')).join('')||'<p>Sem fotografias vinculadas.</p>';
case 'ANEXOS_DOCUMENTAIS':return d.annexes.map(a=>'<p>'+esc(a.name)+'</p>'+(a.data.startsWith('data:image/')?'<figure class="doc-photo"><img src="'+esc(a.data)+'"><figcaption>'+esc(a.name)+'</figcaption></figure>':'<p>PDF relacionado — juntada separada.</p>')).join('')||'<p>Sem anexos.</p>';default:return ''}}
function richDoc(text){let values=docTagValues(),out=[];for(let line of String(text||'').split(/\r?\n/)){if(!line.trim())continue;let tokens=line.split(/(\{\{[A-Z0-9_]+\}\})/g),buf='';function flush(){if(buf.trim())out.push('<p>'+buf+'</p>');buf=''}for(let token of tokens){let m=token.match(/^\{\{([A-Z0-9_]+)\}\}$/);if(m){let k=m[1];if(BLOCK_TAGS.includes(k)){flush();out.push(docBlock(k))}else buf+=Object.hasOwn(values,k)&&String(values[k]??'').trim()?esc(values[k]):'<span class="doc-missing">'+esc(token)+'</span>'}else buf+=esc(token).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}flush()}return out.join('')}
function visibleDoc(n){let d=D();return n.condition==='photos'?d.templates.showPhotos!=='Não'&&d.points.some(x=>x.photos.length):n.condition==='annexes'?d.annexes.length>0:true}
function report(mode){let d=D(),p=P(),m=meta(mode),test=mode==='test',name=DOC_NAMES[mode].toUpperCase(),logo=p.logo&&safeData(p.logo)?'<img alt="Logomarca" src="'+esc(p.logo)+'" style="max-width:45mm;max-height:14mm;object-fit:contain">':'<strong>'+esc(p.name)+'</strong>';
let cover='<section class="doccover"><div style="display:flex;justify-content:space-between;align-items:center">'+logo+'<span>REV '+esc(m.revision)+'</span></div><div class="cover-title"><p>ENGENHARIA · ANCORAGENS</p><h1>'+name+'</h1><h2>'+docText(d.work,'OBRA')+'</h2></div><div class="cover-bottom">'+docKeys([['Contratante',d.client],['Documento',m.code],['Projeto',d.project],['ART',m.art],['Emissão',m.date],['Responsável técnico',p.engineer],['CREA',p.crea]])+'<p class="doc-status">PRÉVIA DE TESTE — SEM LIBERAÇÃO DE USO</p></div></section>';
let body='';function emit(nodes,prefix='',depth=0){let v=nodes.filter(visibleDoc);v.forEach((n,i)=>{let no=prefix?prefix+'.'+(i+1):String(i+1),h=depth?'h3':'h2';body+='<'+h+' data-toc="1" data-depth="'+depth+'">'+esc(no+' '+n.title)+'</'+h+'>'+richDoc(n.text);emit(n.children,no,depth+1)})}emit(ensureDocument(mode));body+='<p class="doc-status">'+(test?'Resultados sujeitos à revisão técnica. Não constitui liberação de uso.':mode==='tech'?'Especificações sujeitas à conferência técnica antes da execução. Não constitui liberação de uso.':'Dimensionamento completo pendente de validação. Não constitui liberação de uso.')+'</p><div class="doc-sign">'+docText(p.engineer,'Responsável técnico')+'<br>CREA '+docText(p.crea,'CREA')+'<br>ART '+docText(m.art,'ART')+'</div>';
return '<div class="doc-tools no-print">'+btn('Voltar ao preenchimento','back')+btn('Editar documento','doceditor')+btn('Imprimir / salvar PDF','print','primary')+'</div><article class="docbook" data-company="'+esc(p.name)+'"><div class="dochead">'+logo+'<span>'+esc(m.code||name)+' · REV '+esc(m.revision)+'</span></div>'+cover+'<div class="doc-source">'+body+'</div></article>'}
function chapterOutline(){let h='',q=chapterQuery.toLocaleLowerCase();walkDoc(ensureDocument(),(n,no,depth)=>{if(q&&!String(n.title+' '+n.text).toLocaleLowerCase().includes(q))return;h+='<button class="chapter-row '+(n.id===activeChapter?'selected':'')+'" style="padding-left:'+Math.min(depth,6)*14+'px" data-doc="select:'+n.id+'"><span class="chapter-no">'+esc(no)+'</span><span>'+esc(n.title)+'</span><i class="'+(n.reviewed?'done':'')+'"></i></button>'});return h||'<p class="muted">Nenhum capítulo localizado.</p>'}
function docEditor(){let list=ensureDocument();if(!findDoc(activeChapter))activeChapter=list[0]?.id||'';let m=findDoc(activeChapter),n=m?.n,count=0,reviewed=0;walkDoc(list,x=>{count++;if(x.reviewed)reviewed++});let tags=Object.keys(docTagValues());let toolbar='<div class="tag-toolbar"><div class="actions"><b>Texto:</b>'+[['bold','B Negrito'],['bullet','• Bolinha'],['arrow','➤ Seta'],['num','1. Número'],['letter','a. Letra'],['indent','↳ Recuar'],['outdent','↰ Recuo anterior']].map(([k,v])=>'<button data-doc="format:'+k+'">'+v+'</button>').join('')+'</div><div class="actions"><label>Campo vinculado <select id="docTag"><optgroup label="Dados do cadastro">'+tags.map(t=>'<option>'+t+'</option>').join('')+'</optgroup><optgroup label="Tabelas, cálculos e anexos">'+BLOCK_TAGS.map(t=>'<option>'+t+'</option>').join('')+'</optgroup></select></label><button data-doc="format:tag">Inserir campo</button></div></div>';
return '<h2>Editor documental — '+DOC_NAMES[docMode]+'</h2><p class="muted">'+reviewed+' de '+count+' capítulos revisados · tags vinculadas aos dados do projeto.</p><div class="actions"><button data-doc="back">Voltar ao preenchimento</button><button data-doc="addroot" class="primary">+ Capítulo</button><button data-doc="saveDefault">Salvar como modelo padrão</button><button data-doc="reset">Restaurar modelo inicial</button><button data-doc="preview" class="primary">Prévia do documento</button></div><div class="doc-editor-layout"><aside class="card outline-panel"><label class="field">Localizar capítulo<input id="docSearch" placeholder="Ex.: cálculo, etiqueta" value="'+esc(chapterQuery)+'"></label><div id="chapterOutline">'+chapterOutline()+'</div></aside><div class="card chapter-panel">'+(n?'<div class="actions"><strong>CAPÍTULO '+esc(m.no)+'</strong><span id="chapterStatus" class="muted">'+(n.reviewed?'Revisado':'Revisão pendente')+'</span></div><label class="field">Título do capítulo / subtópico<input id="docTitle" value="'+esc(n.title)+'"></label><div class="actions"><button data-doc="addchild" class="primary">+ Subtópico</button><button data-doc="up">↑ Subir</button><button data-doc="down">↓ Descer</button><button data-doc="delete" class="danger">Excluir</button></div>'+toolbar+'<label class="field">Texto técnico do documento<textarea id="docText" rows="14">'+esc(n.text)+'</textarea></label><label class="actions"><input type="checkbox" id="docReviewed" style="width:auto" '+(n.reviewed?'checked':'')+'> Revisado para este projeto</label><div class="live-doc"><strong>Prévia formatada e com dados vinculados</strong><div id="docRich">'+richDoc(n.text)+'</div></div>':'<p>Adicione um capítulo.</p>')+'</div></div>'}
function refreshDocLive(){let m=findDoc(activeChapter);if(!m)return;m.n.reviewed=false;let c=$('docReviewed');if(c)c.checked=false;if($('chapterStatus'))$('chapterStatus').textContent='Revisão pendente';if($('docRich'))$('docRich').innerHTML=richDoc(m.n.text);if($('chapterOutline'))$('chapterOutline').innerHTML=chapterOutline();save()}
document.addEventListener('input',e=>{let el=e.target;if(view!=='docedit')return;if(el.id==='docSearch'){chapterQuery=el.value;$('chapterOutline').innerHTML=chapterOutline();return}let m=findDoc(activeChapter);if(!m)return;if(el.id==='docTitle'){m.n.title=el.value;refreshDocLive()}if(el.id==='docText'){m.n.text=el.value;refreshDocLive()}if(el.id==='docReviewed'){m.n.reviewed=el.checked;save();$('chapterStatus').textContent=el.checked?'Revisado':'Revisão pendente';$('chapterOutline').innerHTML=chapterOutline()}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-doc]');if(!el||view!=='docedit')return;let [a,b]=el.dataset.doc.split(':'),m=findDoc(activeChapter),list=ensureDocument();if(a==='select'){activeChapter=b}else if(a==='back'){view=docMode;render();return}else if(a==='preview'){view=docMode;render();document.querySelector('[data-act="preview"]').click();return}else if(a==='addroot'||a==='addchild'){let n=tagChapter(a==='addroot'?'Novo capítulo':'Novo subtópico');if(a==='addchild'&&m)m.n.children.push(n);else list.push(n);activeChapter=n.id}else if(a==='delete'&&m){if(!confirm('Excluir este capítulo e seus subtópicos?'))return;m.arr.splice(m.i,1);activeChapter=''}else if((a==='up'||a==='down')&&m){let j=m.i+(a==='up'?-1:1);if(j>=0&&j<m.arr.length)[m.arr[m.i],m.arr[j]]=[m.arr[j],m.arr[m.i]]}else if(a==='saveDefault'){if(!confirm('Salvar este modelo como padrão para novos projetos deste módulo?'))return;app.docDefaults=app.docDefaults||{};app.docDefaults[docMode]=normalChapters(structuredClone(list));save();alert('Modelo padrão salvo neste navegador.');return}else if(a==='reset'){if(!confirm('Restaurar modelo inicial? A estrutura e os textos personalizados deste documento serão substituídos.'))return;D().docModels[docMode]=seedDocument(docMode);activeChapter=''}else if(a==='format'&&m){let ta=$('docText'),x=ta.selectionStart,y=ta.selectionEnd,selection=ta.value.slice(x,y),ins=b==='bold'?'**'+(selection||'texto')+'**':b==='tag'?'{{'+$('docTag').value+'}}':b==='bullet'?'• '+selection:b==='arrow'?'➤ '+selection:b==='num'?'1. '+selection:b==='letter'?'a. '+selection:b==='indent'?'    '+selection:selection.replace(/^ {1,4}/gm,'');if(b==='tag'&&BLOCK_TAGS.includes($('docTag').value))ins='\n'+ins+'\n';ta.setRangeText(ins,x,y,'end');m.n.text=ta.value;ta.focus();refreshDocLive();return}save();render()});
async function paginateDocument(){const a=$('preview').querySelector('.docbook');if(!a||a.querySelector('.docpage'))return;await Promise.all([...a.querySelectorAll('img')].map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve()));if(document.fonts?.ready)await document.fonts.ready;let head=a.querySelector('.dochead'),cover=a.querySelector('.doccover'),source=a.querySelector('.doc-source');let nodes=[...source.children],pages=[],body,page;function next(){page=document.createElement('section');page.className='docpage';page.append(head.cloneNode(true));body=document.createElement('div');body.className='docbody';page.append(body);let foot=document.createElement('div');foot.className='docfoot';page.append(foot);a.append(page);pages.push(page);return body}function fits(){return body.scrollHeight<=body.clientHeight+1}next().append(cover);let toc=next();toc.innerHTML='<h2>Sumário</h2>';next();function add(node){body.append(node);if(fits())return;node.remove();if(body.children.length)next();body.append(node);if(fits())return;if(node.tagName==='TABLE'&&node.tBodies.length){node.remove();let rows=[...node.tBodies[0].rows],t=node.cloneNode(true);t.tBodies[0].replaceChildren();body.append(t);for(let row of rows){t.tBodies[0].append(row);if(!fits()){row.remove();if(!t.tBodies[0].rows.length)t.remove();if(body.children.length)next();t=node.cloneNode(true);t.tBodies[0].replaceChildren(row);body.append(t);if(!fits())page.classList.add('doc-overflow')}}}else{page.classList.add('doc-overflow')}}for(let i=0;i<nodes.length;i++){let n=nodes[i];if(n.matches('h2,h3')&&i+1<nodes.length){let following=nodes[i+1];body.append(n,following);if(fits()){i++;continue}n.remove();following.remove();if(body.children.length)next();add(n);add(following);i++}else add(n)}head.remove();source.remove();for(let h of a.querySelectorAll('[data-toc]')){let row=document.createElement('div');row.className='doc-toc-row';let label=document.createElement('span');label.textContent=h.textContent;label.style.paddingLeft=Math.min(Number(h.dataset.depth)||0,6)*9+'px';let no=document.createElement('span');no.textContent=String(pages.indexOf(h.closest('.docpage'))+1);row.append(label,no);toc.append(row)}pages.forEach((p,i)=>{let foot=p.querySelector('.docfoot'),brand=document.createElement('span'),n=document.createElement('span');brand.textContent=a.dataset.company;n.textContent='Página '+(i+1)+' de '+pages.length;foot.append(brand,n)});if(pages.some(p=>p.classList.contains('doc-overflow'))){let warning=document.createElement('p');warning.className='notice no-print';warning.textContent='Há blocos maiores que uma página. Confira a impressão e as quebras antes de emitir.';$('preview').prepend(warning)}}

function settings(){return '<h2>Configurações e biblioteca</h2>'+app.profiles.map((p,i)=>section(p.name,grid(field('Nome da empresa','profiles.'+i+'.name')+field('CNPJ','profiles.'+i+'.cnpj')+field('Endereço','profiles.'+i+'.address')+field('Engenheiro responsável','profiles.'+i+'.engineer')+field('CREA','profiles.'+i+'.crea')+field('Cor institucional','profiles.'+i+'.color','color'))+'<label>Logotipo local <input type="file" accept="image/png,image/jpeg,image/webp" data-logo="'+i+'"></label>'+(p.logo?'<img class="thumb" src="'+esc(p.logo)+'">':''),i===0)).join('')+btn('Adicionar empresa','addprofile')+section('Biblioteca técnica','<p>Referência pré-carregada WQE 500 Plus, com parâmetros nominais ainda sujeitos à validação. Adicione configurações do projeto à biblioteca local.</p>'+app.library.map((c,i)=>'<div class="card"><strong>'+esc(c.name)+'</strong><p>'+esc(c.maker+' '+c.model)+' · '+esc(c.type)+'</p>'+btn('Usar no projeto','uselib:'+i)+btn('Excluir da biblioteca','dellib:'+i,'danger')+'</div>').join('')+'<div class="actions">'+D().configs.map((c,i)=>btn('Salvar '+c.name,'savelib:'+i)).join('')+'</div>')+'<p class="muted">Dados ficam neste navegador; exporte JSON para transferência e backup. Nenhum dado de obra é enviado ao servidor.</p>'}
function docs(){return '<h2>Projetos salvos</h2><div class="actions">'+btn('Novo projeto','new','primary')+btn('Exportar projeto atual','export')+'<label class="btn">Importar JSON <input type="file" id="import" accept=".json,application/json"></label></div>'+app.docs.map((d,i)=>'<div class="card"><strong>'+esc(d.work||d.name)+'</strong><p>'+MODES.map(mode=>{let m=initMeta(d)[mode];return esc(DOC_NAMES[mode]+': '+(m.code||'sem código')+' · REV '+m.revision+(m.date?' · '+m.date:''))}).join('<br>')+'</p>'+btn('Abrir','open:'+i)+btn('Excluir cópia','deldoc:'+i,'danger')+'</div>').join('')}
function render(){document.documentElement.style.setProperty('--brand',/^#[0-9a-f]{6}$/i.test(P().color)?P().color:'#166344');$('nav').innerHTML=[['mem','Memorial de cálculo'],['tech','Caderno técnico'],['test','Relatório de ensaio'],['docs','Documentos salvos'],['settings','Configurações e biblioteca']].map(([v,l])=>'<button class="'+(view===v?'active':'')+'" data-act="nav:'+v+'">'+l+'</button>').join('')+'<span class="status" id="saveStatus">Armazenamento local</span>';$('editor').classList.remove('hide');$('preview').classList.add('hide');$('editor').innerHTML='<div class="notice">REV 04 de testes. Cálculos completos de resistência e identidade institucional ainda pendentes de validação.</div>'+(view==='docedit'?docEditor():view==='mem'?memorial():view==='tech'?technical():view==='test'?testForm():view==='docs'?docs():settings());if($('dupes'))$('dupes').textContent=duplicateLabels()?'Há etiquetas vazias ou duplicadas. Corrija antes de concluir.':''}
function readFile(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({name:file.name,data:r.result});r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
function validImport(d){return d&&d.schema===1&&typeof d.id==='string'&&Array.isArray(d.configs)&&d.configs.length>0&&d.configs.every(c=>c&&typeof c.id==='string')&&Array.isArray(d.points)&&d.points.every(p=>p&&typeof p.label==='string'&&Array.isArray(p.photos))&&Array.isArray(d.annexes)&&d.templates&&typeof d.method==='string'}

function cleanImport(d){let defaults=fresh(),o={...defaults,...d,templates:{...defaults.templates,...d.templates}};for(let k of Object.keys(defaults))if(typeof defaults[k]==='string'&&typeof o[k]!=='string')o[k]=defaults[k];o.configs=d.configs.map(c=>({...preset(),...c}));o.points=d.points.map(p=>{let q={...point(p.label,p.group),...p};for(let k of Object.keys(q))if(k!=='photos'&&typeof q[k]!=='string'&&typeof q[k]!=='number')q[k]='';q.photos=p.photos.filter(x=>x&&safeData(x.data)&&x.data.startsWith('data:image/'));return q});o.annexes=d.annexes.filter(x=>x&&safeData(x.data));if(d.docModels){o.docModels={};for(let mode of MODES)if(Array.isArray(d.docModels[mode]))o.docModels[mode]=normalChapters(d.docModels[mode])}initMeta(o);return o}
document.addEventListener('input',e=>{let el=e.target;if(el.dataset.bind){set(el.dataset.bind,el.value);if(el.dataset.bind.startsWith('current.configs.')){let i=Number(el.dataset.bind.split('.')[2]);if($('calcs'+i))$('calcs'+i).innerHTML=renderCalc(D().configs[i])}if($('dupes'))$('dupes').textContent=duplicateLabels()?'Há etiquetas vazias ou duplicadas.':''}});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.bind==='current.company'){render();return}if(el.dataset.bind?.endsWith('.type')||el.dataset.bind?.endsWith('.name')){if(el.tagName==='SELECT')render();return}try{if(el.dataset.photo!==undefined){let i=+el.dataset.photo;for(let f of el.files){if(f.size>12*1024*1024)throw Error('Foto acima de 12 MB');let z=await readFile(f);if(!safeData(z.data)||!z.data.startsWith('data:image/'))throw Error('Formato de imagem não aceito');D().points[i].photos.push(z)}save();document.querySelector('dialog')?.remove();pointDetail(i)}else if(el.dataset.logo!==undefined){let f=el.files[0];if(!f)return;let z=await readFile(f);if(!safeData(z.data)||!z.data.startsWith('data:image/'))throw Error('Formato de imagem inválido');app.profiles[+el.dataset.logo].logo=z.data;save();render()}else if(el.id==='attach'){for(let f of el.files){if(f.size>25*1024*1024)throw Error('Anexo acima de 25 MB');let z=await readFile(f);if(!safeData(z.data))throw Error('Formato não aceito');D().annexes.push(z)}save();render()}else if(el.id==='import'){let d=JSON.parse(await el.files[0].text());if(!validImport(d))throw Error('JSON incompatível');if(!confirm('Substituir o projeto atual? Salve antes se necessário.'))return;app.current=cleanImport(d);save();view='mem';render()}}catch(err){save();alert(err.message)}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let [a,i,j]=el.dataset.act.split(':'),d=D();if(a==='nav'){view=i;render();return}if(a==='preview'){if(duplicateLabels()){alert('Corrija as etiquetas duplicadas ou vazias.');return}$('editor').classList.add('hide');$('preview').innerHTML=report(modeNow());$('preview').classList.remove('hide');paginateDocument().catch(e=>alert('Falha na paginação: '+e.message));window.scrollTo(0,0);return}if(a==='doceditor'){docMode=modeNow();activeChapter='';chapterQuery='';view='docedit';render();return}if(a==='back'){render();return}if(a==='print'){paginateDocument().then(()=>window.print()).catch(e=>alert(e.message));return}if(a==='point'){pointDetail(+i);return}if(a==='closeDialog'){document.querySelector('dialog')?.remove();return}if(a==='delphoto'){d.points[+i].photos.splice(+j,1);save();document.querySelector('dialog')?.remove();pointDetail(+i);return}if(a==='addpoints'){let n=Number($('qty').value),prefix=$('prefix').value,floor=$('floor').value,group=$('group').value;if(!Number.isInteger(n)||n<1||n>1000){alert('Informe de 1 a 1000 pontos por lote.');return}let labels=new Set(d.points.map(x=>x.label.trim().toLowerCase())),k=1;for(let l=0;l<n;l++){while(labels.has((prefix+String(k).padStart(3,'0')).toLowerCase()))k++;let label=prefix+String(k++).padStart(3,'0'),p=point(label,group);p.floor=floor;d.points.push(p);labels.add(label.toLowerCase())}}else if(a==='delpoint'){if(!confirm('Excluir este ponto e seus dados do projeto atual?'))return;d.points.splice(+i,1)}else if(a==='addconfig')d.configs.push(preset());else if(a==='delconfig'){if(d.configs.length===1||d.points.some(p=>p.group===d.configs[+i].id)){alert('Configuração em uso ou única.');return}d.configs.splice(+i,1)}else if(a==='picklib'){view='settings'}else if(a==='uselib'){d.configs.push({...structuredClone(app.library[+i]),id:uid()});view='mem'}else if(a==='savelib'){app.library.push({...structuredClone(d.configs[+i]),id:uid()})}e
